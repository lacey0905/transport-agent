# Vite → GitHub Pages 배포
# 실패 시: Settings → Pages → Source = GitHub Actions 로도 한 번 저장해 주세요.
name: Deploy to GitHub Pages

on:
  push:
    branches: ['main']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        env:
          VITE_BASE: /${{ github.event.repository.name }}/
          VITE_DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
        run: npm run build

      # Pages 사이트가 없으면 configure-pages / deploy-pages 가 Not Found 로 실패함
      - name: Ensure Pages site (GitHub Actions)
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo
            try {
              await github.rest.repos.getPages({ owner, repo })
              core.info('Pages site already exists')
            } catch (err) {
              if (err.status !== 404) throw err
              await github.rest.repos.createPagesSite({
                owner,
                repo,
                build_type: 'workflow',
              })
              core.info('Created Pages site with build_type=workflow')
            }

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

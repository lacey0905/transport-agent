# Vite → GitHub Pages 배포
# 시크릿: Settings → Secrets → Actions (또는 Environment github-pages)
#   이름: DATA_GO_KR_KEY
# 시크릿 추가/수정 후에는 이 워크플로를 다시 실행해야 반영됩니다.
name: Deploy to GitHub Pages

on:
  push:
    branches: ['main']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # Environment 시크릿도 빌드에 주입되도록 동일 environment 사용
    environment: github-pages
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Check API key secret
        env:
          VITE_DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
        run: |
          if [ -z "$VITE_DATA_GO_KR_KEY" ]; then
            echo "::warning::DATA_GO_KR_KEY 시크릿이 비어 있습니다. Pages에서 실시간 버스가 동작하지 않습니다."
            echo "Settings → Secrets and variables → Actions 에 DATA_GO_KR_KEY 를 등록하세요."
          else
            echo "DATA_GO_KR_KEY 시크릿 확인됨 (길이 ${#VITE_DATA_GO_KR_KEY})"
          fi

      - name: Install dependencies
        run: npm ci

      - name: Build
        env:
          VITE_BASE: /${{ github.event.repository.name }}/
          VITE_DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
        run: npm run build

      - name: Ensure Pages site (GitHub Actions)
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo
            try {
              await github.rest.repos.getPages({ owner, repo })
              core.info('Pages site already exists')
            } catch (err) {
              if (err.status !== 404) throw err
              await github.rest.repos.createPagesSite({
                owner,
                repo,
                build_type: 'workflow',
              })
              core.info('Created Pages site with build_type=workflow')
            }

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
